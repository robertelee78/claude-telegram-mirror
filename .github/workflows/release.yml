name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates

      - name: Build release binary
        working-directory: rust-crates
        run: |
          cargo build --release --bin ctm
          strip target/release/ctm
          ls -lh target/release/ctm

      - name: Package release asset
        run: |
          # ADR-017: one raw binary + one .sha256 + one release record per target.
          # `ctm update` and install.sh read the record; the sha256 file is for humans.
          mkdir -p dist
          cp rust-crates/target/release/ctm dist/ctm-x86_64-unknown-linux-gnu
          chmod 755 dist/ctm-x86_64-unknown-linux-gnu
          ( cd dist && sha256sum ctm-x86_64-unknown-linux-gnu > ctm-x86_64-unknown-linux-gnu.sha256 )
          VERSION=$(grep -m1 '^version' rust-crates/ctm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          SIZE=$(stat -c %s dist/ctm-x86_64-unknown-linux-gnu 2>/dev/null || stat -f %z dist/ctm-x86_64-unknown-linux-gnu)
          SHA=$(cut -d' ' -f1 dist/ctm-x86_64-unknown-linux-gnu.sha256)
          printf '{"kind":"ctm.standalone-release","schema_version":1,"package":"ctm","channel":"stable","target":"x86_64-unknown-linux-gnu","version":"%s","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$SIZE" "$SHA" > dist/stable-x86_64-unknown-linux-gnu.json
          cat dist/stable-x86_64-unknown-linux-gnu.json
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates

      - name: Build release binary
        working-directory: rust-crates
        run: |
          cargo build --release --bin ctm
          strip target/release/ctm
          ls -lh target/release/ctm

      # Sign + notarize AFTER strip (strip rewrites the Mach-O and invalidates any
      # signature) and BEFORE the checksum/pack step (so checksums.json covers the
      # signed bytes). Without a trusted Developer ID signature, modern macOS
      # SIGKILLs the launchd-spawned daemon for a code-signing / launch-constraint
      # violation. Gated on secrets so forks/PRs still build (ad-hoc fallback).
      - name: Sign and notarize (Developer ID)
        working-directory: rust-crates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          BIN=target/release/ctm
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "::warning::Apple signing secrets not set — shipping an ad-hoc-signed binary that macOS Gatekeeper may reject. Configure APPLE_* secrets to notarize."
            codesign --force --sign - --timestamp=none "$BIN" || true
            codesign -dvvv "$BIN" 2>&1 || true
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/ctm-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 20)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          # Hardened runtime + secure timestamp are required for notarization.
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # A bare CLI Mach-O is notarized via a zip (it cannot be stapled; Gatekeeper
          # validates the registered cdhash online).
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/ctm.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ctm.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --wait
          codesign -dvvv "$BIN" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package release asset
        run: |
          # ADR-017: one raw binary + one .sha256 + one release record per target.
          # `ctm update` and install.sh read the record; the sha256 file is for humans.
          mkdir -p dist
          cp rust-crates/target/release/ctm dist/ctm-aarch64-apple-darwin
          chmod 755 dist/ctm-aarch64-apple-darwin
          ( cd dist && shasum -a 256 ctm-aarch64-apple-darwin > ctm-aarch64-apple-darwin.sha256 )
          VERSION=$(grep -m1 '^version' rust-crates/ctm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          SIZE=$(stat -c %s dist/ctm-aarch64-apple-darwin 2>/dev/null || stat -f %z dist/ctm-aarch64-apple-darwin)
          SHA=$(cut -d' ' -f1 dist/ctm-aarch64-apple-darwin.sha256)
          printf '{"kind":"ctm.standalone-release","schema_version":1,"package":"ctm","channel":"stable","target":"aarch64-apple-darwin","version":"%s","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$SIZE" "$SHA" > dist/stable-aarch64-apple-darwin.json
          cat dist/stable-aarch64-apple-darwin.json
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/*

  build-darwin-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates

      - name: Build release binary
        working-directory: rust-crates
        run: |
          cargo build --release --target x86_64-apple-darwin --bin ctm
          strip target/x86_64-apple-darwin/release/ctm
          ls -lh target/x86_64-apple-darwin/release/ctm

      # See darwin-arm64 job for rationale. Note: `strip` on the x64 cross-built
      # binary removes its signature entirely, so signing here is mandatory for the
      # Intel package to be runnable at all.
      - name: Sign and notarize (Developer ID)
        working-directory: rust-crates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          BIN=target/x86_64-apple-darwin/release/ctm
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "::warning::Apple signing secrets not set — shipping an ad-hoc-signed binary that macOS Gatekeeper may reject. Configure APPLE_* secrets to notarize."
            codesign --force --sign - --timestamp=none "$BIN" || true
            codesign -dvvv "$BIN" 2>&1 || true
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/ctm-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 20)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/ctm.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ctm.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --wait
          codesign -dvvv "$BIN" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package release asset
        run: |
          # ADR-017: one raw binary + one .sha256 + one release record per target.
          # `ctm update` and install.sh read the record; the sha256 file is for humans.
          mkdir -p dist
          cp rust-crates/target/x86_64-apple-darwin/release/ctm dist/ctm-x86_64-apple-darwin
          chmod 755 dist/ctm-x86_64-apple-darwin
          ( cd dist && shasum -a 256 ctm-x86_64-apple-darwin > ctm-x86_64-apple-darwin.sha256 )
          VERSION=$(grep -m1 '^version' rust-crates/ctm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          SIZE=$(stat -c %s dist/ctm-x86_64-apple-darwin 2>/dev/null || stat -f %z dist/ctm-x86_64-apple-darwin)
          SHA=$(cut -d' ' -f1 dist/ctm-x86_64-apple-darwin.sha256)
          printf '{"kind":"ctm.standalone-release","schema_version":1,"package":"ctm","channel":"stable","target":"x86_64-apple-darwin","version":"%s","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$SIZE" "$SHA" > dist/stable-x86_64-apple-darwin.json
          cat dist/stable-x86_64-apple-darwin.json
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: dist/*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates

      - name: Install cross-linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        working-directory: rust-crates
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu --bin ctm
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/ctm
          ls -lh target/aarch64-unknown-linux-gnu/release/ctm

      - name: Package release asset
        run: |
          # ADR-017: one raw binary + one .sha256 + one release record per target.
          # `ctm update` and install.sh read the record; the sha256 file is for humans.
          mkdir -p dist
          cp rust-crates/target/aarch64-unknown-linux-gnu/release/ctm dist/ctm-aarch64-unknown-linux-gnu
          chmod 755 dist/ctm-aarch64-unknown-linux-gnu
          ( cd dist && sha256sum ctm-aarch64-unknown-linux-gnu > ctm-aarch64-unknown-linux-gnu.sha256 )
          VERSION=$(grep -m1 '^version' rust-crates/ctm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          SIZE=$(stat -c %s dist/ctm-aarch64-unknown-linux-gnu 2>/dev/null || stat -f %z dist/ctm-aarch64-unknown-linux-gnu)
          SHA=$(cut -d' ' -f1 dist/ctm-aarch64-unknown-linux-gnu.sha256)
          printf '{"kind":"ctm.standalone-release","schema_version":1,"package":"ctm","channel":"stable","target":"aarch64-unknown-linux-gnu","version":"%s","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$SIZE" "$SHA" > dist/stable-aarch64-unknown-linux-gnu.json
          cat dist/stable-aarch64-unknown-linux-gnu.json
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu
          path: dist/*

  publish:
    needs: [build-linux-x64, build-linux-arm64, build-darwin-arm64, build-darwin-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          # ADR-017: the GitHub Release IS the distribution. Per target: the binary,
          # its .sha256, and the stable-<triple>.json record that `ctm update` and
          # install.sh resolve through releases/latest/download/. Plus install.sh
          # itself, so a pinned copy travels with every release.
          mkdir -p release
          cp artifacts/*/ctm-* artifacts/*/stable-*.json release/
          cp install.sh release/install.sh
          VERSION=$(grep -m1 '^version' rust-crates/ctm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match Cargo.toml version ${VERSION}"; exit 1
          fi
          # Every record must carry this version, or `ctm update` would install the wrong tag's asset.
          for r in release/stable-*.json; do
            grep -q "\"version\":\"${VERSION}\"" "$r" || { echo "ERROR: $r is not for ${VERSION}"; cat "$r"; exit 1; }
          done
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
