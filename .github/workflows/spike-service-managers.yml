name: spike-service-managers
on: workflow_dispatch
jobs:
  systemd-user:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          id; echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset} DBUS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
          systemctl --version | head -1
          loginctl show-user "$(id -un)" 2>&1 | head -5 || true
          systemctl --user status 2>&1 | head -3 || true
          mkdir -p ~/.config/systemd/user
          cat > ~/.config/systemd/user/ctm-spike.service <<'U'
          [Unit]
          Description=ctm spike
          [Service]
          Type=simple
          ExecStart=/bin/sleep 300
          Restart=on-failure
          RestartSec=2s
          [Install]
          WantedBy=default.target
          U
          systemctl --user daemon-reload; echo "daemon-reload=$?"
          systemctl --user enable ctm-spike.service; echo "enable=$?"
          systemctl --user start ctm-spike.service; echo "start=$?"
          systemctl --user show ctm-spike.service -p LoadState,ActiveState,SubState,MainPID,UnitFileState,NeedDaemonReload,FragmentPath,ExecStart
          pid1=$(systemctl --user show ctm-spike.service -p MainPID --value)
          sed -i 's/sleep 300/sleep 301/' ~/.config/systemd/user/ctm-spike.service
          systemctl --user show ctm-spike.service -p NeedDaemonReload
          systemctl --user restart ctm-spike.service; echo "restart=$?"
          pid2=$(systemctl --user show ctm-spike.service -p MainPID --value); echo "pid1=$pid1 pid2=$pid2"
          systemctl --user show ctm-spike.service -p ExecStart | head -c 200; echo
          systemctl --user stop ctm-spike.service; echo "stop=$?"
          systemctl --user show ctm-spike.service -p ActiveState,MainPID
          systemctl --user disable ctm-spike.service; echo "disable=$?"
          rm ~/.config/systemd/user/ctm-spike.service; systemctl --user daemon-reload
          systemctl --user show ctm-spike.service -p LoadState,UnitFileState
          ls -la ~/.config/systemd/user/default.target.wants/ 2>&1 || true
          echo "--- a unit that dies immediately: does start report success? ---"
          cat > ~/.config/systemd/user/ctm-dies.service <<'U'
          [Service]
          Type=simple
          ExecStart=/bin/false
          Restart=on-failure
          RestartSec=2s
          U
          systemctl --user daemon-reload; systemctl --user start ctm-dies.service; echo "start-dies=$?"
          sleep 1; systemctl --user show ctm-dies.service -p ActiveState,SubState,Result,NRestarts,MainPID
          systemctl --user stop ctm-dies.service; rm ~/.config/systemd/user/ctm-dies.service; systemctl --user daemon-reload
  launchd:
    runs-on: macos-latest
    steps:
      - run: |
          set +e; set -x
          id -u; launchctl print gui/$(id -u) 2>&1 | head -3
          sw_vers
          mkdir -p ~/Library/LaunchAgents
          P=~/Library/LaunchAgents/com.ctm.spike.plist
          cat > "$P" <<'X'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Label</key><string>com.ctm.spike</string>
          <key>ProgramArguments</key><array><string>/bin/sleep</string><string>300</string></array>
          <key>RunAtLoad</key><true/>
          <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/><key>Crashed</key><true/></dict>
          </dict></plist>
          X
          T=gui/$(id -u)/com.ctm.spike
          launchctl print "$T" >/dev/null 2>&1; echo "print-before=$?"
          launchctl bootstrap gui/$(id -u) "$P"; echo "bootstrap=$?"
          launchctl bootstrap gui/$(id -u) "$P"; echo "bootstrap-again=$?"
          launchctl load "$P"; echo "load-when-loaded=$?"
          launchctl print "$T" | grep -E 'program =|pid =|state =' 
          launchctl list | grep spike
          launchctl kickstart -k "$T"; echo "kickstart=$?"; sleep 1; launchctl list | grep spike
          launchctl stop com.ctm.spike; echo "stop=$?"; launchctl list | grep spike; sleep 2; launchctl list | grep spike
          launchctl bootout "$T"; echo "bootout=$?"; sleep 1
          launchctl print "$T" >/dev/null 2>&1; echo "print-after=$?"
          launchctl list | grep spike || echo "gone from list"
          launchctl bootout "$T"; echo "bootout-again=$?"
          launchctl unload "$P"; echo "unload-when-unloaded=$?"
          launchctl start com.ctm.spike; echo "start-when-unloaded=$?"
          rm "$P"
          echo "--- a job that dies immediately ---"
          D=~/Library/LaunchAgents/com.ctm.dies.plist
          sed -e 's#com.ctm.spike#com.ctm.dies#' -e 's#/bin/sleep#/usr/bin/false#' -e 's#<string>300</string>##' "$P.bak" > "$D" 2>/dev/null || printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>Label</key><string>com.ctm.dies</string><key>ProgramArguments</key><array><string>/usr/bin/false</string></array><key>RunAtLoad</key><true/><key>KeepAlive</key><dict><key>SuccessfulExit</key><false/><key>Crashed</key><true/></dict><key>ThrottleInterval</key><integer>10</integer></dict></plist>\n' > "$D"
          launchctl bootstrap gui/$(id -u) "$D"; echo "bootstrap-dies=$?"
          launchctl start com.ctm.dies; echo "start-dies=$?"
          sleep 1; launchctl list | grep dies; launchctl print gui/$(id -u)/com.ctm.dies | grep -E 'state =|pid =|last exit'
          launchctl bootout gui/$(id -u)/com.ctm.dies; rm "$D"
