name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo test

  # ADR-018: the signing pipeline's shape and the signer's refusals, on the OS
  # that signs. Static checks; no credentials are involved.
  darwin-signing-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-darwin-signing-contract.sh
      - run: scripts/test-release-signing-contract.sh

  # ADR-020: the release-signature contract on the OS most installs run on, too.
  release-signing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-release-signing-contract.sh

  # ADR-019: the service layer against the REAL service manager, on each platform.
  # A throwaway unit/plist under a unique label; the runner's own services are untouched.
  service-managers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates
      - run: cargo test --test service_managers -- --nocapture
        working-directory: rust-crates
        env:
          CTM_TEST_SERVICE_MANAGER: "1"
