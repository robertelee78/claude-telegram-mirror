name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
      - run: cargo test

  # ADR-018: the signing pipeline's shape and the signer's refusals, on the OS
  # that signs. Static checks; no credentials are involved.
  darwin-signing-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-darwin-signing-contract.sh
